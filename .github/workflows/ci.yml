name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore back/back.slnx

      - name: Build
        run: dotnet build back/back.slnx --no-restore --configuration Release

      - name: Test (unit + integration + signalr)
        run: dotnet test back/back.slnx --no-build --configuration Release --verbosity normal

      - name: Coverage
        run: >
          dotnet test back/back.slnx --no-build --configuration Release
          /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../../coverage/
          --verbosity normal

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: back/coverage/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --run
